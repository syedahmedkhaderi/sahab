<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Tab and app icon. Next serves this at /icon.svg via the App Router file
    convention, so no metadata.icons entry is needed.

    This is the lockup's tile exactly as components/Wordmark.tsx draws it, at
    the same 100-unit scale, so the two cannot drift. The name is not here: it
    lives beside the tile in the lockup, and would be unreadable at 16px.

    Colours are literal because a favicon is fetched as its own document, where
    the app's CSS variables do not resolve.
  -->
  <rect width="100" height="100" rx="22" fill="#0558b6"/>
  <g fill="#ffffff">
    <circle cx="52" cy="46" r="17.5"/>
    <circle cx="34" cy="54" r="12"/>
    <circle cx="67" cy="55" r="11"/>
    <rect x="22" y="54" width="56" height="13" rx="6.5"/>
  </g>
</svg>
