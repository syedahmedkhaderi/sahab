# Sahab — Prometheus scrape configuration (§17)
# Scrapes: DCGM exporter, node-exporter, cAdvisor, backend /metrics, Traefik.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: sahab-mvp

# ---------------------------------------------------------------------------
# Alerting (placeholder — wire to Alertmanager or Grafana alert rules)
# ---------------------------------------------------------------------------
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# ---------------------------------------------------------------------------
# Scrape configs
# ---------------------------------------------------------------------------
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # NVIDIA DCGM exporter — per-GPU utilization, memory, temperature, power (§17)
  # The manager's own exporter is reached over the Docker network by name; the
  # other GPU servers arrive through file_sd below.
  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          sahab_node: manager
    relabel_configs:
      - source_labels: [sahab_node]
        target_label: instance

  # Node exporter — host OS metrics (CPU, RAM, disk, network)
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          sahab_node: manager
    relabel_configs:
      - source_labels: [sahab_node]
        target_label: instance

  # cAdvisor — per-container metrics (CPU, memory, network per Docker container)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          sahab_node: manager
    relabel_configs:
      - source_labels: [sahab_node]
        target_label: instance

  # The other GPU servers. The backend rewrites nodes.json whenever a machine
  # joins, is drained, or is removed, and Prometheus picks the change up on its
  # own — nobody edits this file to add a machine. One job covers all three
  # exporters because each entry lists all three ports; the port tells them
  # apart, and sahab_node names the machine.
  - job_name: sahab-nodes
    file_sd_configs:
      - files: ["/etc/prometheus/targets/nodes.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [sahab_node]
        target_label: instance

  # FastAPI backend — application metrics exposed at /api/metrics
  - job_name: backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:8000"]

  # Traefik — request rates, error rates, latency per service
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  # JupyterHub — hub metrics (active users, server counts)
  - job_name: jupyterhub
    metrics_path: /hub/metrics
    static_configs:
      - targets: ["jupyterhub:8000"]
