# Sahab — Prometheus scrape configuration (§17)
# Scrapes: DCGM exporter, node-exporter, cAdvisor, backend /metrics, Traefik.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: sahab-mvp

# ---------------------------------------------------------------------------
# Alerting (placeholder — wire to Alertmanager or Grafana alert rules)
# ---------------------------------------------------------------------------
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# ---------------------------------------------------------------------------
# Scrape configs
# ---------------------------------------------------------------------------
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # NVIDIA DCGM exporter — per-GPU utilization, memory, temperature, power (§17)
  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: gpu-server

  # Node exporter — host OS metrics (CPU, RAM, disk, network)
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: gpu-server

  # cAdvisor — per-container metrics (CPU, memory, network per Docker container)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: gpu-server

  # FastAPI backend — application metrics exposed at /api/metrics
  - job_name: backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:8000"]

  # Traefik — request rates, error rates, latency per service
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  # JupyterHub — hub metrics (active users, server counts)
  - job_name: jupyterhub
    metrics_path: /hub/metrics
    static_configs:
      - targets: ["jupyterhub:8000"]
