# Traefik dynamic configuration — shared middlewares
# This file is watched by the file provider; changes take effect without restart.

http:
  middlewares:
    # Strip /api prefix before forwarding to FastAPI (FastAPI mounts routes at /, not /api).
    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api"

    # Basic security headers.
    #
    # NOTE: despite what this comment used to claim, NO router currently
    # references this middleware, so none of these headers are being sent.
    #
    # If you do wire it up, do NOT reintroduce `frameDeny: true`. The workspace
    # shell at /sessions/<id>/workspace embeds JupyterLab from /user/* in a
    # same-origin iframe, and X-Frame-Options: DENY would break it into a blank
    # frame with only a console error to show why. The CSP below is the modern
    # equivalent and permits exactly that same-origin embed and nothing else.
    secure-headers:
      headers:
        contentSecurityPolicy: "frame-ancestors 'self'"
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""

    # Returns 403 without forwarding. Used to keep an internal-only path off the
    # public entrypoint while leaving it reachable over the Docker network.
    block-public:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
