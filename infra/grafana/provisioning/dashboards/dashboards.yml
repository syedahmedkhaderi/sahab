# Grafana dashboard provisioning — loads JSON dashboards from disk
apiVersion: 1

providers:
  - name: sahab-dashboards
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
